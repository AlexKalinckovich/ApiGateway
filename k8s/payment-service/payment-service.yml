apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: alexkalinck-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment
          image: docker.io/alexkalinck/apigateway-payment-service:1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 8085
              name: http
          envFrom:
            - configMapRef:
                name: payment-service-config
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-service-secrets
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-service-secrets
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: MONGO_DB_URI
              valueFrom:
                secretKeyRef:
                  name: payment-service-secrets
                  key: MONGO_DB_URI
            - name: SERVER_PORT
              value: "8085"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: "PLAINTEXT"
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "payment-group"
            - name: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
              value: "earliest"
            - name: SPRING_KAFKA_PROPERTIES_SESSION_TIMEOUT_MS
              value: "30000"
            - name: SPRING_KAFKA_PROPERTIES_REQUEST_TIMEOUT_MS
              value: "40000"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: alexkalinck-dev
  labels:
    app: payment-service
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
  type: ClusterIP