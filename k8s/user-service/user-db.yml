apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: userdb-pvc
  namespace: alexkalinck-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: user-db
  namespace: alexkalinck-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-db
  template:
    metadata:
      labels:
        app: user-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: "userdb"
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-service-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: MYSQL_ROOT_HOST
              value: "%"
            - name: MYSQL_INNODB_BUFFER_POOL_SIZE
              value: "256M"
            - name: MYSQL_INNODB_LOG_FILE_SIZE
              value: "128M"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: userdb-pvc
  serviceName: user-db
---
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: alexkalinck-dev
spec:
  clusterIP: None
  selector:
    app: user-db
  ports:
    - port: 3306
      targetPort: 3306