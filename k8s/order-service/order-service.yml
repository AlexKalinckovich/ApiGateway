apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: alexkalinck-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo waiting for kafka; sleep 5; done; echo "Kafka is ready!";']
      containers:
        - name: order-service
          image: docker.io/alexkalinck/apigateway-order-service:1.0
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: DOCKER_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DOCKER_USERNAME
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: user-service-config
                  key: USER_SERVICE_URL
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: ORDER_SERVICE_PROFILE
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: order-service-secrets
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: order-service-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-service-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SERVER_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: SERVER_ADDRESS
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL
              value: "PLAINTEXT"
            - name: SPRING_KAFKA_CONSUMER_GROUP_ID
              value: "order-group"
            - name: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
              value: "earliest"
            - name: SPRING_KAFKA_PROPERTIES_SESSION_TIMEOUT_MS
              value: "30000"
            - name: SPRING_KAFKA_PROPERTIES_REQUEST_TIMEOUT_MS
              value: "40000"
            - name: SPRING_KAFKA_PROPERTIES_MAX_POLL_INTERVAL_MS
              value: "60000"
            - name: SPRING_KAFKA_LISTENER_MISSING_TOPICS_FATAL
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: alexkalinck-dev
  labels:
    app: order-service
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  type: ClusterIP